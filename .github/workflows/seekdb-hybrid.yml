name: Native seekdb hybrid acceptance

on:
  push:
    branches: [task/retrieval-02-hybrid-search, task/competition-combined]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: make -C competition install
      - run: make -C competition check-baseline test-hybrid test-pdf
      - run: competition/.venv/bin/python -m pytest -q tests/builtin/persistence/test_seekdb_hybrid_parity.py
        env:
          PYTHONPATH: src
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    - id: receipt_check
      type: custom
      position:
        x: 3600
        y: 100
      positionAbsolute:
        x: 3600
        y: 100
      width: 244
      height: 98
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 校验入藏回执
        desc: ''
        selected: false
        version: '1'
        code_language: python3
        code: "import json\n\n\ndef _object(value):\n    if isinstance(value, dict):\n        return value\n\
          \    if isinstance(value, str):\n        try:\n            parsed = json.loads(value)\n    \
          \    except ValueError:\n            return None\n        return parsed if isinstance(parsed,\
          \ dict) else None\n    return None\n\n\ndef main(status_code: int, body: object, answer_markdown:\
          \ str) -> dict:\n    data = _object(body)\n    if data is None:\n        return {\n        \
          \    \"ok\": \"no\",\n            \"display\": \"\",\n            \"error\": \"展品已经生成，但记忆写入结果无法解析；本轮不会伪称入藏成功。\"\
          ,\n        }\n    if not (200 <= int(status_code or 0) < 300) or data.get(\"ok\") is not True:\n\
          \        status = str(data.get(\"status\") or \"error\")\n        if status == \"unknown\":\n\
          \            message = \"PowerContext 没有返回确定的写入结果。为避免重复写入，本轮没有自动重试。\"\n        else:\n     \
          \       error = data.get(\"error\") or {}\n            detail = error.get(\"message\") if isinstance(error,\
          \ dict) else \"\"\n            message = \"展品已生成，但本轮入藏未成功：\" + str(detail or status)\n     \
          \   return {\n            \"ok\": \"no\",\n            \"display\": answer_markdown.strip()\
          \ + \"\\n\\n---\\n⚠️ \" + message,\n            \"error\": message,\n        }\n\n    records\
          \ = data.get(\"records\")\n    artifact_id = \"\"\n    if isinstance(records, list) and records\
          \ and isinstance(records[0], dict):\n        artifact = records[0].get(\"artifact\")\n     \
          \   if isinstance(artifact, dict):\n            artifact_id = str(artifact.get(\"artifact_id\"\
          ) or \"\")\n    source = data.get(\"source\")\n    source_id = source.get(\"source_id\") if\
          \ isinstance(source, dict) else \"\"\n    receipt = (\n        \"\\n\\n---\\n\"\n        \"\U0001F510\
          \ 灰灯馆长已把这件小事封存进 PowerContext。\\n\"\n        \"馆藏编号：`\" + (artifact_id or \"已返回成功\") + \"`\\\
          n\"\n        \"来源编号：`\" + (str(source_id) or \"已返回来源回执\") + \"`\"\n    )\n    return {\n   \
          \     \"ok\": \"yes\",\n        \"display\": answer_markdown.strip() + receipt,\n        \"\
          error\": \"\",\n    }\n"
        variables:
        - variable: status_code
          value_selector:
          - remember_http
          - status_code
        - variable: body
          value_selector:
          - remember_http
          - body
        - variable: answer_markdown
          value_selector:
          - parse_exhibit
          - answer_markdown
        outputs:
          ok:
            type: string
            children: null
          display:
            type: string
            children: null
          error:
            type: string
            children: null
        error_strategy: fail-branch

[project]
name = "memory-museum-backend"
version = "0.1.0"
description = "Per-user PowerContext adapter and deterministic validation model for Memory Museum."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.119.1",
  "httpx==0.28.1",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "PyYAML==6.0.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["museum"]

[tool.pytest.ini_options]
testpaths = ["tests"]

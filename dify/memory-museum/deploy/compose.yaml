name: memory-museum

services:
  powercontext:
    image: memory-museum-powercontext:729dc4c5
    build:
      context: ${POWERCONTEXT_SOURCE:?Run bootstrap.py first}
      dockerfile: docker/Dockerfile
      args:
        POWERCONTEXT_VERSION: ${POWERCONTEXT_VERSION:-1.5.0}
    environment:
      POWERCONTEXT_HOME: /data
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: "8000"
      POWERCONTEXT_SERVER_ACCESS_MODE: enforced
      POWERCONTEXT_SERVER_AUTH_TOKEN: ${POWERCONTEXT_TOKEN:?Set POWERCONTEXT_TOKEN}
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "true"
    ports:
      - 127.0.0.1:${POWERCONTEXT_PORT:-18082}:8000
    volumes:
      - ${MUSEUM_DATA:?Set MUSEUM_DATA}/powercontext:/data
    networks:
      - shared
    restart: unless-stopped

  museum:
    image: memory-museum-backend:0.1.0
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      MUSEUM_SERVICE_KEY: ${MUSEUM_SERVICE_KEY:?Set MUSEUM_SERVICE_KEY}
      MUSEUM_DB_PATH: /data/museum.sqlite3
      POWERCONTEXT_URL: http://powercontext:8000
      POWERCONTEXT_TOKEN: ${POWERCONTEXT_TOKEN:?Set POWERCONTEXT_TOKEN}
    ports:
      - 127.0.0.1:${MUSEUM_PORT:-18081}:8080
    volumes:
      - ${MUSEUM_DATA:?Set MUSEUM_DATA}/museum:/data
    depends_on:
      powercontext:
        condition: service_healthy
    networks:
      - shared
    restart: unless-stopped

networks:
  shared:
    external: true
    name: museum-shared
